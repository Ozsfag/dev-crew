# Dependabot: авто-PR на обновление зависимостей.
# Бесплатно, встроено в GitHub, использует GitHub Security Advisory DB.
# Дополняет Trivy CVE-scan: Trivy — gate (что уязвимо), Dependabot — fix (готовый PR).

version: 2
updates:
  # --- Gradle (build.gradle) ---
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "gradle"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Группируем minor+patch в один PR — снижает шум.
    groups:
      spring:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework.security:*"
      testing:
        patterns:
          - "org.junit.*"
          - "org.mockito:*"
          - "org.assertj:*"
          - "org.testcontainers:*"
          - "com.tngtech.archunit:*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # --- GitHub Actions ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"

  # --- Docker base images (docker/Dockerfile) ---
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
